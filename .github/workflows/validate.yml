name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.11.0"
            requirements: requirements_test.txt
          - ha: "2026.10.4"
            requirements: requirements_test_2026_10.txt
          - ha: "2026.7.4"
            requirements: requirements_test_2026_7.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test*.txt

      - name: Install test dependencies
        run: python -m pip install --requirement ${{ matrix.requirements }}

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Install FFmpeg for speech normalization tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        if: matrix.ha == '2026.11.0'
        run: mypy

      - name: Run Home Assistant-native tests
        if: ${{ !cancelled() }}
        run: >-
          pytest
          --cov=custom_components.mistral_conversation
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json

      - name: Enforce branch coverage
        run: >-
          python -c "import json; t = json.load(open('coverage.json'))['totals'];
          assert t['covered_branches'] / t['num_branches'] >= 0.85,
          f'Branch coverage is below 85%: {t}'"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.ha }}
          path: coverage.xml
          if-no-files-found: ignore

  validate-hacs:
    name: HACS readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate HACS repository structure
        run: python scripts/validate_hacs.py

      - name: HACS validation
        if: ${{ github.event.repository.private == false }}
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
